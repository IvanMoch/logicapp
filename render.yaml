databases:
  - name: logicapp-db
    databaseName: logicapp_db
    user: logicapp_user
    plan: free

services:
  - type: web
    name: logicapp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npx ts-node --project tsconfig.seed.json prisma/seed.ts
    startCommand: node dist/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logicapp-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: logicapp-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
