databases:
  - name: logicapp-db
    databaseName: logicapp_db
    user: logicapp_user
    plan: free

services:
  - type: web
    name: logicapp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logicapp-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
